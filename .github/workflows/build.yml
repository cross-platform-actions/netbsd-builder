name: Build VM Disk Image

env:
  PACKER_VERSION: '1.8.4'
  SIMH_VERSION: 'v0.0.1'

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: ${{ matrix.version }}, ${{ matrix.architecture.name }}
    runs-on: ubuntu-latest
    strategy:
        # One job's flaky mirror shouldn't cancel the other builds.
        fail-fast: false
        matrix:
          version:
            - 9.2
            - 9.3
            - 9.4
            - '10.0'
            - '10.1'
            - '11.0'

          architecture:
            - name: x86-64
              qemu: x86
              qemu_executable: x86_64
              uname: amd64

            - name: arm64
              qemu: aarch64
              uname: aarch64

          # NetBSD/VAX is built by the SIMH plugin, not qemu, so it can't
          # be part of the architecture list above — add one extra job per
          # version that has a vax var file.
          include:
            - version: '10.1'
              architecture:
                name: vax
                uname: vax

            - version: '11.0'
              architecture:
                name: vax
                uname: vax

          exclude:
            - version: 9.2
              architecture:
                name: arm64
                qemu: aarch64

            - version: 9.3
              architecture:
                name: arm64
                qemu: aarch64

            - version: 9.4
              architecture:
                name: arm64
                qemu: aarch64

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y fdisk dosfstools rsync curl python3

          # qemu only for the qemu-backed architectures; vax uses SIMH.
          if [ -n '${{ matrix.architecture.qemu }}' ]; then
            sudo apt install -y qemu-system-${{ matrix.architecture.qemu }}

            if [ -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd ]; then
              sudo ln -s /usr/share/qemu-efi-aarch64/QEMU_EFI.fd /usr/share/qemu/edk2-aarch64-code.fd
            fi
          fi

      # The SIMH VAX simulator the plugin drives. The build runs on
      # x86-64 Linux runners. Locally, assume `vax` is already on PATH.
      - name: Install SIMH (vax)
        if: matrix.architecture.name == 'vax'
        run: |
          curl -sSfL -o /tmp/vax.tar \
            "https://github.com/cross-platform-actions/simh-builder/releases/download/${SIMH_VERSION}/vax-linux-x86-64.tar"
          sudo tar -xf /tmp/vax.tar -C /usr/local/bin vax
          command -v vax

      - name: Print QEMU version
        if: matrix.architecture.name != 'vax'
        run: '"qemu-system-${{ matrix.architecture.qemu_executable || matrix.architecture.qemu }}" --version'

      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Build Image
        env:
          # packer init resolves plugins via the GitHub API; anonymous
          # requests share the runner IP's rate limit and get 403s.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The vax build fetches the prebuilt packages with `gh release
          # download`, which reads GH_TOKEN. Unauthenticated it shares the
          # runner IP's anonymous rate limit and intermittently 403s.
          # netbsd-pkg-repo is public, so the repo-scoped token only needs
          # to lift the rate limit, not grant access.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # headless is a qemu-template variable; the vax template
          # doesn't declare it, and passing an undeclared -var is a hard
          # error, so only pass it for the qemu architectures.
          extra_args=""
          if [ '${{ matrix.architecture.name }}' != 'vax' ]; then
            extra_args="-var headless=true"
          fi
          PACKER_LOG=1 ./build.sh \
            '${{ matrix.version }}' \
            '${{ matrix.architecture.name }}' \
            $extra_args

      # When the install goes wrong, packer only reports that it gave up
      # waiting for SSH. The guest console says what actually happened.
      #
      # The two templates write it in different places. The qemu one points a
      # chardev at `console.log` in the working directory, deliberately not in
      # the output directory, since packer refuses to start when that exists
      # and isn't empty. The SIMH plugin writes into the output directory it
      # manages itself, as `<vm_name>.console.log` via `SET CONSOLE LOG` plus
      # `<vm_name>.console.tee.log` mirrored as it reads the console, both on
      # by default. So match all of them rather than one fixed path.
      #
      # Expect real content for ARM64 and VAX, whose console is the serial
      # port: they log the whole install, from the firmware to `login:`. On
      # x86-64 the console is the display instead, and the single boot from
      # disk during a build happens before provision.sh sets `consdev`, so
      # nothing is written to the serial port and the log holds just QEMU's
      # own one-line virtual console banner. That is not a broken capture.
      - name: Print the guest console log
        if: failure()
        run: |
          printed=false

          for log in console.log output/*.console.log output/*.console.tee.log; do
            [ -f "$log" ] || continue
            printed=true
            echo "===== $log"
            cat "$log"
          done

          if [ "$printed" = false ]; then
            echo 'No console log was produced'
          fi

      - name: Upload the guest console log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.version }}-${{ matrix.architecture.name }}
          # Named explicitly rather than uploading the output directory, which
          # also holds the built image.
          path: |
            console.log
            output/*.console.log
            output/*.console.tee.log
          if-no-files-found: warn

      - name: Start Local HTTP Server
        if: matrix.architecture.name != 'vax'
        run: python3 -m http.server 8080 --directory output &

      - name: Create File
        if: matrix.architecture.name != 'vax'
        run: echo 'host to guest' > host_to_guest.txt

      # qemu architectures are booted by cross-platform-actions/action.
      - name: Test Image
        if: matrix.architecture.name != 'vax'
        uses: cross-platform-actions/action@master
        with:
          operating_system: netbsd
          architecture: ${{ matrix.architecture.name }}
          version: '${{ matrix.version }}'
          image_url: http://localhost:8080/netbsd-${{ matrix.version }}-${{ matrix.architecture.name }}.qcow2
          shutdown_vm: false
          shell: bash
          run: |
            set -x
            printf 'uname -a: '; uname -a
            printf 'uname -s: '; uname -s
            printf 'uname -r: '; uname -r
            printf 'uname -v: '; uname -v
            printf 'uname -m: '; uname -m
            printf 'uname -p: '; uname -p
            printf 'pwd: '; pwd
            printf 'echo $SHELL: '; echo $SHELL
            printf 'whoami: '; whoami
            printf 'hostname: '; hostname
            echo 'ls -lah:'; ls -lah
            echo 'env | sort:'; env | sort
            [ "`uname -s`" = 'NetBSD' ]
            [ "`uname -r`" = '${{ matrix.version }}' ]
            [ "`uname -m`" = '${{ matrix.architecture.uname || matrix.architecture.name }}' ] || [ "`uname -p`" = '${{ matrix.architecture.uname || matrix.architecture.name }}' ]
            [ "`pwd`" = '/home/runner/work/netbsd-builder/netbsd-builder' ]
            [ "`hostname`" = 'runnervmg1sw1.local' ]

            # Everything the image is expected to add on top of a stock
            # install: bash, curl, rsync and sudo come from pkgsrc via
            # provision.sh, pkgin from the sysinst binary-packages step that
            # installs them, cc from the sysinst "Compiler tools" set.
            # `exit 1` rather than relying on the script running under -e.
            echo 'installed tools:'
            for cmd in bash curl pkgin rsync sudo cc; do
              printf '%s: ' "$cmd"
              command -v "$cmd" || exit 1
            done

            # The install also selects every X11 set, and nothing noticed when
            # a wrong set-menu keystroke silently dropped them. One
            # representative file per set is enough to tell installed from not:
            # xbase, xcomp, xetc, xfont, xserver in that order. The fonts
            # directory itself belongs to xbase, so xfont has to be checked by
            # a font file rather than by the directory.
            echo 'X11 sets:'
            for path in \
              /usr/X11R7/bin/xrdb \
              /usr/X11R7/include/X11/Xlib.h \
              /etc/X11/xdm/Xaccess \
              /usr/X11R7/lib/X11/fonts/misc/10x20-ISO8859-1.pcf.gz \
              /usr/X11R7/bin/Xvfb
            do
              if [ -e "$path" ]; then
                echo "$path ok"
              else
                echo "$path MISSING"
                exit 1
              fi
            done

            cat host_to_guest.txt | grep -q 'host to guest'
            echo 'guest to host' > guest_to_host.txt

      - name: Verify File Synchronization
        if: matrix.architecture.name != 'vax'
        run: cat guest_to_host.txt | grep -q 'guest to host'

      # cross-platform-actions/action is qemu-based and can't run a VAX
      # image, so boot the built image under SIMH directly: decompress the
      # distributed artifact to RAW (what a consumer does), autoboot the
      # disk via EXPECT/SEND, wait for sshd, and run uname as the secondary
      # user over password ssh — the credential the consumer logs in with.
      - name: Test Image (vax)
        if: matrix.architecture.name == 'vax'
        run: |
          set -eux
          sudo apt-get install -y sshpass

          zstd -dc "output/netbsd-${{ matrix.version }}-vax.img.zst" > disk.raw

          # Autoboot the disk hands-free; forward host 2222 -> guest ssh.
          {
            echo "set cpu 64m"
            echo "set rq0 ra92"
            echo "attach rq0 disk.raw"
            echo "attach xq nat:tcp=2222:10.0.2.15:22"
            echo 'expect ">>>" send "boot dua0\r"; go'
            echo "boot cpu"
          } > test-vax.simh
          vax test-vax.simh > vax-console.log 2>&1 &
          simh_pid=$!

          # ConnectTimeout also bounds the SSH banner exchange (OpenSSH
          # 8.4+), and the emulated VAX needs more than a few seconds to
          # fork sshd and send its banner — 5s aborts every attempt on CI
          # runners. Attempts while the port is still closed fail
          # instantly via slirp's RST, so a long timeout doesn't slow the
          # boot-wait polling down.
          ssh_vax() {
            sshpass -p runner ssh -p 2222 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -o ConnectTimeout=60 runner@127.0.0.1 "$@"
          }

          # The host keys are pre-generated into the image, but booting
          # an emulated VAX to sshd still takes ~15 minutes — and a loaded
          # CI runner (or a boot that falls back to regenerating a host key)
          # can push well past that, so poll for up to ~60 minutes. Attempts
          # while the port is still closed fail instantly via slirp's RST, so
          # a generous cap doesn't slow the common case.
          ok=
          for _ in $(seq 1 180); do
            if ssh_vax true 2>/dev/null; then ok=1; break; fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo '=== vax console log ==='; cat vax-console.log || true
            kill "$simh_pid" 2>/dev/null || true
            exit 1
          fi

          uname_out=$(ssh_vax 'uname -sm')
          echo "guest uname: $uname_out"

          # Verify the tools the image adds on top of a stock install were
          # baked in: the pkgsrc ones under /usr/pkg/bin, plus cc from the
          # sysinst "Compiler tools" set. Checking the binaries by absolute
          # path avoids both pkgdb-location ambiguity and any dependence on
          # what PATH a non-interactive ssh session gets.
          # A line continuation, not a newline: the list is interpolated into
          # the remote `for` below, where a newline would end it early.
          tools="/usr/pkg/bin/bash /usr/pkg/bin/curl /usr/pkg/bin/pkgin \
            /usr/pkg/bin/rsync /usr/pkg/bin/sudo /usr/bin/cc"

          tools_out=$(ssh_vax "for b in $tools; do
              if [ -x \"\$b\" ]; then echo \"\$b ok\"; else echo \"\$b MISSING\"; fi
            done")
          echo "guest tools:"; echo "$tools_out"

          kill "$simh_pid" 2>/dev/null || true
          echo "$uname_out" | grep -q NetBSD
          echo "$uname_out" | grep -q vax
          for b in $tools; do
            echo "$tools_out" | grep -qx "$b ok"
          done

      - name: Create Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_ref_name: ${{ github.ref_name }}
        run: |
          version="${github_ref_name#v}"

          # Ship only the distributable image: the compressed RAW for vax
          # (not the 1.5 GB raw .img or console logs), the qcow2 otherwise.
          artifacts="${{ matrix.architecture.name == 'vax' && 'output/*.img.zst' || 'output/*.qcow2' }}"

          # Matrix jobs run in parallel; the first to arrive creates the
          # draft release, the rest upload their artifacts to it.
          # (gh release create with --draft does not deduplicate by tag.)
          if gh release view "$github_ref_name" >/dev/null 2>&1; then
            gh release upload "$github_ref_name" $artifacts --clobber
          else
            sed -n "/^## \[${version}\]/,/^## \[/{/^## \[${version}\]/d;/^## \[/d;p;}" changelog.md \
              | gh release create \
                "$github_ref_name" \
                --title "NetBSD ${version}" \
                --draft \
                --notes-file - \
                $artifacts
          fi
